name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: ruff check
        run: uv run --no-project --with ruff ruff check .
      - name: ruff format
        run: uv run --no-project --with ruff ruff format --check .
      - name: install shellcheck v0.11.0
        run: |
          curl -fsSL -o sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  sc.tar.xz" | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo install -m 0755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no scripts/*.sh yet; skipping"
          else
            shellcheck "${files[@]}"
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: unittest
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -v
      - name: install kubeconform v0.8.0
        run: |
          curl -fsSL -o kc.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kc.tar.gz" | sha256sum -c -
          tar -xzf kc.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: kubeconform
        run: |
          if [ -d k8s ] && [ -n "$(find k8s -name '*.yaml' -o -name '*.yml' | head -1)" ]; then
            kubeconform -strict -summary -ignore-missing-schemas k8s/
          else
            echo "no k8s/ manifests yet; skipping"
          fi
      - name: kyverno policy check
        run: echo "Kyverno policies are checked in gke-ai-observer (check-policies.sh); not run here."
